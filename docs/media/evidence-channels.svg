<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Evidence channels">
<title>Evidence channels</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1200" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
<text x="32" y="44" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">Evidence channels for the RQ2 ablation</text>
<text x="32" y="68" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Each run config lists channel combinations; names are always included</text>
<rect x="32" y="96" width="270" height="132" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="96" width="5" height="132" rx="2.5" fill="#4f46e5"/>
<text x="50" y="125" font-size="14.5" fill="#4f46e5" font-weight="700" text-anchor="start">names</text>
<text x="50" y="150" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">table and column names, SQL types</text>
<text x="50" y="196" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">customer.c_custkey INTEGER</text>
<rect x="322" y="96" width="270" height="132" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="322" y="96" width="5" height="132" rx="2.5" fill="#0369a1"/>
<text x="340" y="125" font-size="14.5" fill="#0369a1" font-weight="700" text-anchor="start">stats</text>
<text x="340" y="150" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">distinct, NULLs, min/max, top-k values</text>
<text x="340" y="196" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">[distinct=150; nulls=0; …]</text>
<rect x="612" y="96" width="270" height="132" rx="12" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="612" y="96" width="5" height="132" rx="2.5" fill="#b45309"/>
<text x="630" y="125" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="start">samples</text>
<text x="630" y="150" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">seeded sample rows per table</text>
<text x="630" y="196" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">(5090, Gus Hanason, N, …)</text>
<rect x="902" y="96" width="270" height="132" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="902" y="96" width="5" height="132" rx="2.5" fill="#0f766e"/>
<text x="920" y="125" font-size="14.5" fill="#0f766e" font-weight="700" text-anchor="start">logs</text>
<text x="920" y="150" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">equi-join pairs mined from queries</text>
<text x="920" y="196" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">o_custkey = c_custkey: 4</text>
<text x="32" y="268" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">Ablation in configs/experiment.yaml:</text>
<rect x="280" y="254" width="50.0" height="22" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.6"/>
<text x="305.0" y="269" font-size="11.5" fill="#4f46e5" font-weight="600" text-anchor="middle">names</text>
<rect x="340.0" y="254" width="122.0" height="22" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.6"/>
<text x="401.0" y="269" font-size="11.5" fill="#4f46e5" font-weight="600" text-anchor="middle">names + samples</text>
<rect x="472.0" y="254" width="179.6" height="22" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.6"/>
<text x="561.8" y="269" font-size="11.5" fill="#4f46e5" font-weight="600" text-anchor="middle">names + stats + samples</text>
<rect x="661.6" y="254" width="230.0" height="22" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.6"/>
<text x="776.6" y="269" font-size="11.5" fill="#4f46e5" font-weight="600" text-anchor="middle">names + stats + samples + logs</text>
<text x="32" y="306" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start">Prompts are trimmed to the token budget (samples first, then top-k values, join pairs, statistics) and stored under their SHA-256.</text>
</svg>
