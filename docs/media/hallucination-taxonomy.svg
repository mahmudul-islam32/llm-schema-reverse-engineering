<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hallucination taxonomy">
<title>Hallucination taxonomy</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1200" height="360" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
<text x="32" y="44" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">How every false positive is classified</text>
<text x="32" y="68" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Checked in priority order — the first matching category wins, so each FP has exactly one</text>
<rect x="32" y="100" width="210" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="100" width="5" height="90" rx="2.5" fill="#334155"/>
<text x="50" y="129" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Q1</text>
<text x="50" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">references a table or</text>
<text x="50" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">column that does not exist?</text>
<path d="M137.0,192 L137.0,226" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="145.0" y="213.0" font-size="11" fill="#475569" font-weight="normal" text-anchor="start">yes</text>
<rect x="32" y="228" width="210" height="48" rx="12" fill="#fff1f2" stroke="#be123c" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="228" width="5" height="48" rx="2.5" fill="#be123c"/>
<text x="50" y="257" font-size="14.5" fill="#be123c" font-weight="700" text-anchor="start">non_existent_column</text>
<path d="M244,145 L266,145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="255.0" y="139" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">no</text>
<rect x="268" y="100" width="210" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="268" y="100" width="5" height="90" rx="2.5" fill="#334155"/>
<text x="286" y="129" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Q2</text>
<text x="286" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">an FK whose reverse</text>
<text x="286" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">is a gold FK?</text>
<path d="M373.0,192 L373.0,226" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="381.0" y="213.0" font-size="11" fill="#475569" font-weight="normal" text-anchor="start">yes</text>
<rect x="268" y="228" width="210" height="48" rx="12" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="268" y="228" width="5" height="48" rx="2.5" fill="#b45309"/>
<text x="286" y="257" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="start">wrong_direction</text>
<path d="M480,145 L502,145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="491.0" y="139" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">no</text>
<rect x="504" y="100" width="210" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="504" y="100" width="5" height="90" rx="2.5" fill="#334155"/>
<text x="522" y="129" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Q3</text>
<text x="522" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">overlaps a gold label but</text>
<text x="522" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">has a different arity?</text>
<path d="M609.0,192 L609.0,226" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="617.0" y="213.0" font-size="11" fill="#475569" font-weight="normal" text-anchor="start">yes</text>
<rect x="504" y="228" width="210" height="48" rx="12" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="504" y="228" width="5" height="48" rx="2.5" fill="#b45309"/>
<text x="522" y="257" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="start">wrong_arity</text>
<path d="M716,145 L738,145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="727.0" y="139" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">no</text>
<rect x="740" y="100" width="210" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="740" y="100" width="5" height="90" rx="2.5" fill="#334155"/>
<text x="758" y="129" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Q4</text>
<text x="758" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">rejected by the</text>
<text x="758" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">SQL verifier?</text>
<path d="M845.0,192 L845.0,226" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="853.0" y="213.0" font-size="11" fill="#475569" font-weight="normal" text-anchor="start">yes</text>
<rect x="740" y="228" width="210" height="48" rx="12" fill="#fff1f2" stroke="#be123c" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="740" y="228" width="5" height="48" rx="2.5" fill="#be123c"/>
<text x="758" y="257" font-size="14.5" fill="#be123c" font-weight="700" text-anchor="start">contradicted_by_data</text>
<path d="M952,145 L974,145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="963.0" y="139" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">no</text>
<rect x="976" y="100" width="196" height="176" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="976" y="100" width="5" height="176" rx="2.5" fill="#15803d"/>
<text x="994" y="129" font-size="14.5" fill="#15803d" font-weight="700" text-anchor="start">plausible_not_in_gold</text>
<text x="994" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">holds in the data but</text>
<text x="994" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">is not in the gold set</text>
<text x="994" y="192" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">→ manual audit</text>
<text x="994" y="211" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">(gold may be incomplete)</text>
<text x="32" y="318" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start">Hallucination rate = (missing-column + verifier-rejected proposals) ÷ all proposals. Verifier thresholds: FK coverage ≥ 0.95, UCC uniqueness ≥ 0.99, FD g3 ≤ 0.05.</text>
</svg>
