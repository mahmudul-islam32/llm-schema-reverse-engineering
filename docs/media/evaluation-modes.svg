<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Methods and evaluation modes">
<title>Methods and evaluation modes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1200" height="420" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
<text x="32" y="44" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">Methods compared and how they are scored</text>
<text x="32" y="68" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">All methods emit the same proposal format {type, lhs, rhs, confidence, rationale}</text>
<rect x="32" y="100" width="380" height="56" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="100" width="5" height="56" rx="2.5" fill="#6d28d9"/>
<text x="50" y="129" font-size="14.5" fill="#6d28d9" font-weight="700" text-anchor="start">profiling</text>
<text x="50" y="146" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">exact UCC / FD / IND discovery</text>
<text x="440" y="134" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">complete, but noisy</text>
<path d="M412,128 L432,128 M610,128 L650,128" stroke="#475569" stroke-width="1.6"/>
<rect x="32" y="170" width="380" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="170" width="5" height="56" rx="2.5" fill="#4f46e5"/>
<text x="50" y="199" font-size="14.5" fill="#4f46e5" font-weight="700" text-anchor="start">llm[channels]</text>
<text x="50" y="216" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">vLLM prompt per evidence combination</text>
<text x="440" y="204" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">semantic, may hallucinate</text>
<path d="M412,198 L432,198 M610,198 L650,198" stroke="#475569" stroke-width="1.6"/>
<rect x="32" y="240" width="380" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="240" width="5" height="56" rx="2.5" fill="#4f46e5"/>
<text x="50" y="269" font-size="14.5" fill="#4f46e5" font-weight="700" text-anchor="start">heuristic[channels]</text>
<text x="50" y="286" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">name + statistics rules, no model</text>
<text x="440" y="274" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">transparent reference point</text>
<path d="M412,268 L432,268 M610,268 L650,268" stroke="#475569" stroke-width="1.6"/>
<rect x="32" y="310" width="380" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="310" width="5" height="56" rx="2.5" fill="#4f46e5"/>
<text x="50" y="339" font-size="14.5" fill="#4f46e5" font-weight="700" text-anchor="start">hybrid-*</text>
<text x="50" y="356" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">candidates from profiling, ranked</text>
<text x="440" y="344" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">RQ5: best of both?</text>
<path d="M412,338 L432,338 M610,338 L650,338" stroke="#475569" stroke-width="1.6"/>
<rect x="700" y="100" width="220" height="118" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="700" y="100" width="5" height="118" rx="2.5" fill="#334155"/>
<text x="718" y="129" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">as proposed</text>
<text x="718" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">LLM-only / raw</text>
<text x="718" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">scored against gold</text>
<rect x="700" y="238" width="220" height="118" rx="12" fill="#fff1f2" stroke="#be123c" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="700" y="238" width="5" height="118" rx="2.5" fill="#be123c"/>
<text x="718" y="267" font-size="14.5" fill="#be123c" font-weight="700" text-anchor="start">+verify</text>
<text x="718" y="292" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">only proposals the</text>
<text x="718" y="311" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">SQL verifier accepts</text>
<rect x="950" y="100" width="218" height="256" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="950" y="100" width="5" height="256" rx="2.5" fill="#0f766e"/>
<text x="968" y="129" font-size="14.5" fill="#0f766e" font-weight="700" text-anchor="start">scored on</text>
<text x="968" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">exact match</text>
<text x="968" y="173" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">column-set overlap</text>
<text x="968" y="192" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">top-k = ceil(k·|gold|)</text>
<text x="968" y="211" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">bootstrap 95% CI</text>
<text x="968" y="230" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">micro / macro across DBs</text>
<text x="968" y="249" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">paired permutation test</text>
<text x="968" y="268" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">hallucination rate</text>
<text x="968" y="287" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">parse-failure rate</text>
<path d="M650,128 L650,338" stroke="#475569" stroke-width="1.6"/>
<path d="M650,160 L698,160" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M650,296 L698,296" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M920,160 L948,200" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M920,296 L948,260" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="32" y="396" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start">FK direction matters (A→B ≠ B→A); FDs are split into single right-hand sides; UCC column order is ignored.</text>
</svg>
