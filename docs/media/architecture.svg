<text x="582" y="566" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">names + statistics rules (no LLM)</text>
<rect x="564" y="622" width="268" height="94" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="564" y="622" width="5" height="94" rx="2.5" fill="#4f46e5"/>
