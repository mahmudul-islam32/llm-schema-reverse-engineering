<text x="582" y="676" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">LLM / heuristic scores the</text>
<text x="582" y="695" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">baseline&#x27;s candidates (RQ5)</text>
