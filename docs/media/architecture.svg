<text x="934" y="297" font-size="14.5" fill="#0f766e" font-weight="700" text-anchor="start">Evaluator</text>
<text x="904" y="322" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">P / R / F1 per FK, UCC, FD</text>
<text x="904" y="341" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">bootstrap CIs · top-k · overlap</text>
<text x="904" y="360" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">hallucination taxonomy</text>
