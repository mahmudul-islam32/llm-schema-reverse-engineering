<text x="582" y="300" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">HyFD · HyUCC · BINDER</text>
<text x="582" y="319" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">via metanome-cli</text>
