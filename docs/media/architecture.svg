<text x="58" y="682" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">configs/*.yaml</text>
<rect x="276" y="92" width="250" height="640" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="290" y="112" font-size="11" fill="#475569" font-weight="700" text-anchor="start">PREPARE &amp; OBSERVE</text>
<rect x="292" y="124" width="218" height="104" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.45" filter="url(#shadow)"/>
