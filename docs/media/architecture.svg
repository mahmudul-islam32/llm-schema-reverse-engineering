<text x="612" y="397" font-size="14.5" fill="#4f46e5" font-weight="700" text-anchor="start">LLM proposer</text>
<text x="582" y="422" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">prompt = chosen evidence</text>
<text x="582" y="441" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">channels within a token budget</text>
<text x="582" y="460" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">JSON-schema output, cached</text>
<rect x="564" y="512" width="268" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
