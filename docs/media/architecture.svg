<text x="58" y="153" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Database</text>
<text x="58" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">built-in generator</text>
<text x="58" y="197" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">or PostgreSQL / SQLite</text>
<text x="58" y="216" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">with declared keys</text>
