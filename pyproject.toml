[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srev"
version = "0.1.0"
description = "LLM-assisted schema reverse engineering: discover FKs, UCCs and FDs in undocumented databases and benchmark LLMs against statistical profiling."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mahmudul Islam" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
pandas = ["pandas>=2.0"]
dev = [
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
srev = "srev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srev = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a PostgreSQL server (set SREV_TEST_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# layout code: long literal coordinate/label lines read better unwrapped
"docs/media/tools/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/srev"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
