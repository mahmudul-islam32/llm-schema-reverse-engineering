<text x="340" y="641" font-size="14.5" fill="#0369a1" font-weight="700" text-anchor="start">Query-log miner</text>
<text x="310" y="666" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">equi-join pairs</text>
<text x="310" y="685" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">+ parse-failure counts</text>
