<text x="340" y="153" font-size="14.5" fill="#15803d" font-weight="700" text-anchor="start">Ground truth</text>
<text x="310" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">PK/UNIQUE → UCC, FK → FK</text>
<text x="310" y="197" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">curated labels kept apart</text>
<rect x="292" y="246" width="218" height="104" rx="12" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="292" y="246" width="5" height="104" rx="2.5" fill="#b45309"/>
<circle cx="320" cy="270" r="12" fill="#b45309"/>
<text x="320" y="274.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="340" y="275" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="start">Noise injector</text>
<text x="310" y="300" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">renames · NULLs · typos</text>
<text x="310" y="319" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">orphans · L0–L3, seeded</text>
<rect x="292" y="368" width="218" height="104" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="292" y="368" width="5" height="104" rx="2.5" fill="#334155"/>
<circle cx="320" cy="392" r="12" fill="#334155"/>
<text x="320" y="396.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="340" y="397" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Working copy</text>
<text x="310" y="422" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">materialised with</text>
<text x="310" y="441" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">no constraints at all</text>
<rect x="292" y="490" width="218" height="104" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="292" y="490" width="5" height="104" rx="2.5" fill="#0369a1"/>
<circle cx="320" cy="514" r="12" fill="#0369a1"/>
