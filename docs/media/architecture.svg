<text x="582" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">all minimal UCCs, FDs, INDs</text>
<text x="582" y="197" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">IND into UCC → FK candidate</text>
