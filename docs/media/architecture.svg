<text x="58" y="316" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">.sql · pg_stat_statements</text>
<text x="58" y="335" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">CSV · JSONL</text>
<rect x="40" y="384" width="198" height="104" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="40" y="384" width="5" height="104" rx="2.5" fill="#334155"/>
<text x="58" y="413" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Curated gold</text>
<text x="58" y="438" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">semantic FDs and FKs</text>
<text x="58" y="457" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">(optional JSON)</text>
<rect x="40" y="506" width="198" height="104" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="40" y="506" width="5" height="104" rx="2.5" fill="#334155"/>
<text x="58" y="535" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">LLM endpoint</text>
<text x="58" y="560" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">vLLM or any</text>
<text x="58" y="579" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">OpenAI-compatible API</text>
<rect x="40" y="628" width="198" height="88" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="40" y="628" width="5" height="88" rx="2.5" fill="#334155"/>
