<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="srev run pipeline">
<title>srev run pipeline</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1200" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
<text x="32" y="44" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">What `srev run` does for every database × noise level</text>
<text x="32" y="68" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Each step writes an artefact into runs/&lt;timestamp&gt;_&lt;name&gt;/ so every number is traceable</text>
<rect x="32" y="104" width="128" height="118" rx="12" fill="#f8fafc" stroke="#334155" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="32" y="104" width="5" height="118" rx="2.5" fill="#334155"/>
<circle cx="60" cy="128" r="12" fill="#334155"/>
<text x="60" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="80" y="133" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">Load data</text>
<text x="50" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">generate or read,</text>
<text x="50" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">checksum</text>
<text x="96.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">manifest.json</text>
<path d="M162,163 L176,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="178" y="104" width="128" height="118" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="178" y="104" width="5" height="118" rx="2.5" fill="#15803d"/>
<circle cx="206" cy="128" r="12" fill="#15803d"/>
<text x="206" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="226" y="133" font-size="14.5" fill="#15803d" font-weight="700" text-anchor="start">Gold labels</text>
<text x="196" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">declared +</text>
<text x="196" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">curated</text>
<text x="242.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">gold/*.json</text>
<path d="M308,163 L322,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="324" y="104" width="128" height="118" rx="12" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="324" y="104" width="5" height="118" rx="2.5" fill="#b45309"/>
<circle cx="352" cy="128" r="12" fill="#b45309"/>
<text x="352" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="372" y="133" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="start">Add noise</text>
<text x="342" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">seeded, logged</text>
<text x="342" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">renames mapped</text>
<text x="388.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">noise/*.json</text>
<path d="M454,163 L468,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="470" y="104" width="128" height="118" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="470" y="104" width="5" height="118" rx="2.5" fill="#0369a1"/>
<circle cx="498" cy="128" r="12" fill="#0369a1"/>
<text x="498" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="518" y="133" font-size="14.5" fill="#0369a1" font-weight="700" text-anchor="start">Extract</text>
<text x="488" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">stats, samples,</text>
<text x="488" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">join pairs</text>
<text x="534.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">evidence/*.json</text>
<path d="M600,163 L614,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="616" y="104" width="128" height="118" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="616" y="104" width="5" height="118" rx="2.5" fill="#4f46e5"/>
<circle cx="644" cy="128" r="12" fill="#4f46e5"/>
<text x="644" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="664" y="133" font-size="14.5" fill="#4f46e5" font-weight="700" text-anchor="start">Propose</text>
<text x="634" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">each method ×</text>
<text x="634" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">channels × seeds</text>
<text x="680.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">prompts/, llm_cache/</text>
<path d="M746,163 L760,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="762" y="104" width="128" height="118" rx="12" fill="#fff1f2" stroke="#be123c" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="762" y="104" width="5" height="118" rx="2.5" fill="#be123c"/>
<circle cx="790" cy="128" r="12" fill="#be123c"/>
<text x="790" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="810" y="133" font-size="14.5" fill="#be123c" font-weight="700" text-anchor="start">Verify</text>
<text x="780" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">SQL statistic</text>
<text x="780" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">per proposal</text>
<text x="826.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">proposals.jsonl</text>
<path d="M892,163 L906,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="908" y="104" width="128" height="118" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="908" y="104" width="5" height="118" rx="2.5" fill="#0f766e"/>
<circle cx="936" cy="128" r="12" fill="#0f766e"/>
<text x="936" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
<text x="956" y="133" font-size="14.5" fill="#0f766e" font-weight="700" text-anchor="start">Evaluate</text>
<text x="926" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">raw and +verify</text>
<text x="926" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">variants</text>
<text x="972.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">metrics.csv</text>
<path d="M1038,163 L1052,163" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="1054" y="104" width="128" height="118" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="1054" y="104" width="5" height="118" rx="2.5" fill="#6d28d9"/>
<circle cx="1082" cy="128" r="12" fill="#6d28d9"/>
<text x="1082" y="132.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
<text x="1102" y="133" font-size="14.5" fill="#6d28d9" font-weight="700" text-anchor="start">Report</text>
<text x="1072" y="158" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">tables, charts,</text>
<text x="1072" y="177" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">DDL + ER</text>
<text x="1118.0" y="254" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">report.md, synth/</text>
<text x="32" y="300" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start">Variants: every method is scored twice when verify: true — as proposed (LLM-only) and after the SQL verifier (hybrid mode).</text>
</svg>
