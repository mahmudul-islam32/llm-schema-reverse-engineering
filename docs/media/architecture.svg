<text x="340" y="519" font-size="14.5" fill="#0369a1" font-weight="700" text-anchor="start">Extractor</text>
<text x="310" y="544" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">types · statistics · top-k</text>
<text x="310" y="563" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">seeded row samples</text>
<rect x="292" y="612" width="218" height="104" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-opacity="0.45" filter="url(#shadow)"/>
<rect x="292" y="612" width="5" height="104" rx="2.5" fill="#0369a1"/>
